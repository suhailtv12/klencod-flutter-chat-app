name: chat_app
description: A secure, real-time, end-to-end encrypted chat application built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 1. التخزين المحلي وإدارة الحسابات وقوائم الحظر
  shared_preferences: ^2.2.2

  # 2. بروتوكول الاتصال اللحظي وإرسال واستقبال الرسائل عبر السيرفر
  web_socket_channel: ^3.0.1
  http: ^1.2.2

  # 3. إدارة أذونات النظام للمكالمات (الكاميرا، الميكروفون، التخزين)
  permission_handler: ^11.3.1

  # 4. التشفير التام وحماية البيانات (E2EE & AES-256)
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # 5. تنسيق التواريخ واللغة (تم تحديثه ليتوافق مع فلاتر ويحل الخطأ)
  intl: ^0.20.3

  # 6. الأيقونات والتصميم المتقدم
  cupertino_icons: ^1.0.8

  # 7. محرك مكالمات الصوت والفيديو (تم تفعيله ليعمل call_screen.dart)
  agora_rtc_engine: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true